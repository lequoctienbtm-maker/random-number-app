<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Random Spinner 1-9</title>
    <!-- Google Fonts: Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080811;
            --card-bg: rgba(16, 18, 27, 0.85);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffea00;
            --text-glow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            --pink-glow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* Hiệu ứng lưới Cyberpunk */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Hiệu ứng đường quét Scanline */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Khung chứa chính */
        .container {
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        /* Tiêu đề */
        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: var(--text-glow);
            text-transform: uppercase;
        }

        /* Khung hiển thị số */
        .display-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 35px auto;
            border: 3px solid var(--neon-pink);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: var(--pink-glow);
            position: relative;
            overflow: hidden;
        }

        .display-box::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 0, 85, 0.1), transparent);
            transform: rotate(45deg);
            animation: reflex 3s infinite linear;
        }

        @keyframes reflex {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        #number {
            font-size: 7rem;
            font-weight: 900;
            color: #fff;
            text-shadow: var(--pink-glow);
            transition: transform 0.1s ease;
        }

        /* Hiệu ứng khi dừng quay (Win) */
        .win-animation {
            animation: popWin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--neon-yellow) !important;
            text-shadow: 0 0 15px var(--neon-yellow), 0 0 30px var(--neon-yellow) !important;
        }

        @keyframes popWin {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Nút quay số Cyberpunk */
        .btn-spin {
            background: transparent;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            letter-spacing: 2px;
        }

        .btn-spin:hover:not(:disabled) {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            text-shadow: none;
            transform: translateY(-2px);
        }

        .btn-spin:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-spin:disabled {
            border-color: #555;
            color: #555;
            text-shadow: none;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBER RANDOM</h1>
        
        <div class="display-box">
            <div id="number">?</div>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="startSpin()">QUAY SỐ</button>
    </div>

    <script>
        const numberDisplay = document.getElementById('number');
        const spinBtn = document.getElementById('spinBtn');
        
        let isSpinning = false;

        function startSpin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            numberDisplay.classList.remove('win-animation');
            
            let counter = 0;
            const totalSpeedCycles = 25; // Số lần đổi số nhanh
            const speed = 40; // Tốc độ đổi số (ms)

            // Hiệu ứng xáo số nhanh
            const interval = setInterval(() => {
                const tempRandom = Math.floor(Math.random() * 9) + 1;
                numberDisplay.textContent = tempRandom;
                counter++;

                if (counter >= totalSpeedCycles) {
                    clearInterval(interval);
                    
                    // Chốt kết quả ngẫu nhiên từ 1 đến 9
                    const finalResult = Math.floor(Math.random() * 9) + 1;
                    numberDisplay.textContent = finalResult;
                    
                    // Kích hoạt hiệu ứng dừng
                    numberDisplay.classList.add('win-animation');
                    
                    // Mở lại nút bấm
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, speed);
        }
    </script>
</body>
</html>
